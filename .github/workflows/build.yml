name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mcp2Oauth.slnx

      - name: Build
        run: dotnet build Mcp2Oauth.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Mcp2Oauth.slnx --configuration Release --no-build
